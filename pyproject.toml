[project]
name = "ai_news_aggregator"
version = "0.1.0"
description = "ai_news_aggregator using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0"
]

[project.scripts]
ai_news_aggregator = "ai_news_aggregator.main:run"
run_crew = "ai_news_aggregator.main:run"
train = "ai_news_aggregator.main:train"
replay = "ai_news_aggregator.main:replay"
test = "ai_news_aggregator.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

