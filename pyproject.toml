[project]
name = "contentforge"
version = "0.1.0"
description = "ContentForge - multi-format content generation from persisted research"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.40,<3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0",
    "typer>=0.12"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0"
]
# Nicer PDF output (HTML/CSS -> PDF). Needs system libraries (pango, cairo); the ReportLab
# fallback works without them. `pip install -e ".[pdf]"`
pdf = ["weasyprint>=60"]

[project.scripts]
contentforge = "contentforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contentforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

