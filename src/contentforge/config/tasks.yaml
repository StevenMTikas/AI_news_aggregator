keyword_research_task:
  description: >
    Conduct comprehensive keyword research for {topic} to identify the most relevant,
    trending, and high-impact keywords. Focus on finding keywords that are:
    - Currently trending and popular in {current_year} for {audience}
    - Relevant to {audience}
    - Related to practical applications and real-world use cases for {audience}
    - Include both short-tail and long-tail keywords
    - Cover different aspects of {topic} (technical, practical, benefits, challenges) for {audience}
    - Include related terms, synonyms, and variations

    Search for keywords across different categories: trending terms, search volume,
    competition level, and user intent. Prioritize keywords that everyday people
    would actually search for when interested in {topic}.
  expected_output: >
    A comprehensive keyword research report for {topic} including:

    **DETAILED KEYWORD ANALYSIS:**
    - Long-tail keywords (3-5 variations based on primary keywords)
    - Trending keywords for {current_year}
    - Related terms and synonyms
    - Keywords by category (technical, practical, benefits, challenges)
    - Search intent analysis (informational, commercial, navigational)
    - Keyword difficulty assessment
    - Recommended focus keywords for content creation
    - Keywords organized by priority and relevance

  agent: keyword_researcher
  verbose: true

research_task:
  description: >
    Using the keyword research results provided, look for the {topic} Search for current news, trends, and real-world
    applications from {current_year} that specifically relate to these primary keywords.
    Use the trending terms and long-tail keywords to guide your search strategy. Find at
    least 5 different sources or examples of how these primary keywords are being used
    or will be used by {audience}, prioritizing content that matches the search intent
    and user interests identified in the keyword research. Focus on practical, relatable
    examples that {audience} can understand and that correspond to what they're
    actually searching for based on the keyword research findings.
  expected_output: >
    A comprehensive research report about the {topic} identified in the keyword
    research, including:
    - Latest developments and news from {current_year} focused on the primary keywords
    - How the {topic} impacts {audience}
    - Key trends and future implications of the {topic}
    - Content organized by keyword categories (technical, practical, benefits, challenges)
    - Sources and references for all information on {topic}
    - Research findings mapped to keyword search intent (informational, commercial, navigational)
    - Clear identification of which primary keywords are being researched and why they're relevant
  agent: researcher
  verbose: true
  context: [keyword_research_task]

blog_writer_task:
  description: >
    Using the research provided, look for the {topic} section
    from the keyword research task. Write an engaging blog post about this {topic}
    as the main topic. The blog post should focus on the primary keywords found in the
    keyword research. Write for {audience}, who want to understand how these primary
    keywords affect them. Use a {tone} tone throughout. Include practical examples,
    relatable scenarios, and avoid unexplained jargon. Make it interesting and accessible
    to {audience}.

    This content is being written for the "{project_name}" project. Attribute authorship
    to {author}. Use these category tags where relevant: {category_tags}. Target
    approximately {target_word_count} words total across all sections.

    Structure your output according to the required schema:
    - title: the blog post's title
    - meta_description: a short summary (~150 characters) suitable standalone as a
      social caption or SEO description
    - hook: 1-2 opening sentences that could stand alone as a post opener
    - sections: 3-5 sections, each with a heading, a body, and an optional short
      pull_quote (a standalone shareable line lifted from that section)
    - key_points: a bulleted list of the main takeaways
    - call_to_action: an optional closing prompt for the reader
    - tags: drawn from the keyword research, reusable as hashtags/categories
    - sources: the sources used in the research
  expected_output: >
    A BlogContent object matching the required schema: title, meta_description, hook,
    sections (each with heading/body/optional pull_quote), key_points, optional
    call_to_action, tags, and sources. Written for {audience} in a {tone} tone,
    approximately {target_word_count} words, attributed to {author} for the
    "{project_name}" project.
  agent: blog_writer
  verbose: true
  context: [research_task, keyword_research_task]
  output_pydantic: BlogContent