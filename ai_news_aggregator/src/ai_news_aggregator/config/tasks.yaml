research_task:
  description: >
    Conduct thorough research about {topic} focusing on the latest developments
    and how they impact everyday life. Search for current news, trends, and
    real-world applications from {current_year}. Find at least 5 different
    sources or examples of how {topic} is being used or will be used in daily life.
    Focus on practical, relatable examples that everyday people can understand.
  expected_output: >
    A comprehensive research report about {topic} including:
    - Latest developments and news from {current_year}
    - How {topic} impacts everyday life (home, work, health, education, etc.)
    - Key trends and future implications
    - Sources and references for all information
  agent: researcher

blog_writer_task:
  description: >
    Using the research provided, write an engaging, conversational blog post about {topic}
    formatted for GitHub Pages (Jekyll). The post should be written for everyday readers
    who want to understand how {topic} affects their daily lives. Use a warm, friendly tone
    like you're explaining to a friend. Include practical examples, relatable scenarios,
    and avoid technical jargon. Make it interesting and accessible.

    Format the blog post with proper Jekyll front matter including:
    - title
    - date ({current_year})
    - categories: [AI, Technology, Everyday Life]
    - author: AI News Aggregator
    - layout: post

    The blog content should include:
    - Engaging introduction that hooks the reader
    - 3-5 main sections covering different aspects
    - Real-world examples and practical applications
    - Conversational, friendly tone throughout
    - Conclusion that summarizes key takeaways
    - Be between 400-800 words per post
  expected_output: >
    A complete blog post in Markdown format with Jekyll front matter, ready to upload
    to GitHub Pages. The post should be 400-800 words, engaging, conversational, and
    focused on showing everyday readers how {topic} impacts their daily lives. Written
    in a friendly, accessible tone that non-technical readers will enjoy and understand.
  agent: blog_writer
